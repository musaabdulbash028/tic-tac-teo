
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Tic Tac </title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="heading">
            <div class="symbols"><span>X</span> <span>O</span></div>
            <h1>Tic Tac Toe</h1>
            <p>Think <span>•</span> Place <span>•</span> Win</p>
        </header>

        <section class="game-layout">
            <aside class="sidebar">
                <div class="player-card player-x">
                    <span class="player-symbol">X</span>
                    <div>
                        <h2>Player X</h2>
                        <p>Blue player</p>
                    </div>
                </div>

                <div class="player-card player-o">
                    <span class="player-symbol">O</span>
                    <div>
                        <h2>Player O</h2>
                        <p>Pink player</p>
                    </div>
                </div>

                <button id="new-game" class="new-game">
                    ↻ New Game
                </button>
            </aside>

            <section class="board-area">
                <div class="status" id="status" aria-live="polite">
                    Player X's turn
                </div>

                <div class="board" id="board" role="group"
                     aria-label="Tic Tac Toe board">
                    <button class="cell" aria-label="Cell 1"></button>
                    <button class="cell" aria-label="Cell 2"></button>
                    <button class="cell" aria-label="Cell 3"></button>
                    <button class="cell" aria-label="Cell 4"></button>
                    <button class="cell" aria-label="Cell 5"></button>
                    <button class="cell" aria-label="Cell 6"></button>
                    <button class="cell" aria-label="Cell 7"></button>
                    <button class="cell" aria-label="Cell 8"></button>
                    <button class="cell" aria-label="Cell 9"></button>
                </div>
            </section>

            <aside class="score-card">
                <h2>Scoreboard</h2>
                <div class="score-row">
                    <span class="score-symbol blue">X</span>
                    <span>Player X</span>
                    <strong id="score-x">0</strong>
                </div>
                <div class="score-row">
                    <span class="score-symbol pink">O</span>
                    <span>Player O</span>
                    <strong id="score-o">0</strong>
                </div>
                <div class="score-row draws">
                    <span>Draws</span>
                    <strong id="score-draw">0</strong>
                </div>
                <button id="reset-score" class="reset-score">
                    Reset Score
                </button>
            </aside>
        </section>

        <section class="instructions">
            <span class="bulb">✦</span>
            <div>
                <h2>How to Play</h2>
                <p>
                    Take turns placing X and O. Get three in a row
                    horizontally, vertically, or diagonally to win!
                </p>
            </div>
        </section>

        <footer>MADE WITH ♥ & JAVASCRIPT</footer>
    </main>
</body>
</html>
